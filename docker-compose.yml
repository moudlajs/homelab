# Cap container logs so json-file logs can't fill the OrbStack VM disk (#96)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: homelab_adguard
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf

  ntopng:
    image: ntop/ntopng:latest
    container_name: homelab_ntopng
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data/ntopng:/var/lib/ntopng
    # Retention has no CLI flags; it lives in redis prefs, seeded here on every start.
    # See docs/NETWORK_MONITORING.md#ntopng-data-retention
    environment:
      NTOPNG_TS_RETENTION_DAYS: "30"
      NTOPNG_ALERT_RETENTION_DAYS: "30"
      NTOPNG_MAX_ALERTS: "50000"
    entrypoint:
      - /bin/bash
      - -c
      - |
        /etc/init.d/redis-server start
        until redis-cli ping >/dev/null 2>&1; do sleep 0.5; done
        redis-cli set ntopng.prefs.ts_and_stats_data_retention_days "$$NTOPNG_TS_RETENTION_DAYS" >/dev/null
        redis-cli set ntopng.prefs.max_num_secs_before_delete_alert "$$((NTOPNG_ALERT_RETENTION_DAYS * 86400))" >/dev/null
        redis-cli set ntopng.prefs.max_entity_alerts "$$NTOPNG_MAX_ALERTS" >/dev/null
        exec ntopng "$$@" $$NTOP_CONFIG
      - ntopng
    command: --community --http-port 3002 --disable-login 1

  suricata:
    image: jasonish/suricata:latest
    container_name: homelab_suricata
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    volumes:
      - ./data/suricata/logs:/var/log/suricata
      - ./data/suricata/rules:/var/lib/suricata/rules
      - ./config/suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./config/suricata/logrotate.conf:/etc/suricata-logrotate.conf:ro
      - ./config/suricata/logrotate.cron:/etc/cron.hourly/suricata-logrotate:ro
    environment:
      - ENABLE_CRON=yes
    command: -i eth0

  scrypted:
    image: koush/scrypted:latest
    container_name: homelab_scrypted
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    volumes:
      - ./data/scrypted:/server/volume
    environment:
      - SCRYPTED_INSECURE_PORT=11080

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: homelab_uptime-kuma
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    volumes:
      - ./data/uptime-kuma:/app/data
