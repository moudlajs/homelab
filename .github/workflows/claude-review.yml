name: Claude review

# Green must mean this commit was reviewed (CLAUDE.md, "Independent review").
# Ported from moudlajs/bootleg; bootleg#N below are the incidents behind each guard.

on:
  pull_request:
    # Drafts no-op; marking ready asks for a review, later pushes re-review.
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# Per event type, so a comment can't replace a queued review run.
concurrency:
  group: claude-review-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Dependabot is skipped (no secrets). Draft state is NOT decided here: see the first step (bootleg#16).
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicit bash adds pipefail, so a failing gh api fails the step.
        shell: bash
    steps:
      # Skip only if payload AND live API say draft: a racing push once skipped the review (bootleg#16).
      - name: Skip drafts
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          PAYLOAD_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          live="$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq .isDraft)"
          draft=false
          if [ "$PAYLOAD_DRAFT" = "true" ] && [ "$live" = "true" ]; then draft=true; fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          if [ "$draft" = "true" ]; then
            echo "PR #$PR is a draft - no review. Mark it ready to request one."
          fi

      # Never run a fork's code with this repo's secrets (pwn request).
      - name: Refuse @claude runs on fork PRs
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          fork="$(gh pr view "$PR" --repo "$REPO" --json isCrossRepository --jq .isCrossRepository)"
          if [ "$fork" != "false" ]; then
            echo "::error::PR #$PR comes from a fork; @claude will not run its code with this repo's secrets."
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.draft.outputs.draft != 'true'
        with:
          fetch-depth: 0
          # Reviewer runs dotnet build/test on PR code; keep GITHUB_TOKEN out of .git/config.
          persist-credentials: false
          # Comment runs would check out main; review the PR instead.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      # Lets the reviewer run dotnet build/test (same .NET version as ci.yml).
      - uses: actions/setup-dotnet@v4
        if: steps.draft.outputs.draft != 'true'
        with:
          dotnet-version: 8.0.x

      - uses: anthropics/claude-code-action@v1
        if: steps.draft.outputs.draft != 'true'
        with:
          # From `claude setup-token` (subscription, not an API key).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # No attribution footer or trailer; the verify step enforces it.
          settings: |
            {"attribution": {"commit": "", "pr": ""}, "includeGitInstructions": false}

          # Without these it reviews but can't post ("No buffered inline comments").
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format --verify-no-changes:*),Bash(git diff:*),Bash(git log:*)"

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            The PR branch is checked out in the working directory. You did not
            write this code; review it as an independent reviewer.

            Post findings as GitHub comments, not as a returned message, or
            nobody will see them:
              - `mcp__github_inline_comment__create_inline_comment` with
                `confirmed: true` for a specific line
              - `gh pr comment` for the overall summary. You MUST post this
                summary, and only once you have actually completed the
                review. Its first line MUST be exactly:
                  ## Claude review of ${{ github.event.pull_request.head.sha || 'comment' }}
                A workflow step checks for that heading; without it the
                review counts as not done. If you could not review (missing
                files, tool errors), post a comment WITHOUT that heading
                explaining why.
              - Never add a "Generated with Claude Code" footer, a
                Co-Authored-By trailer or any other attribution line to
                anything you post.

            Read CLAUDE.md and CONTRIBUTING.md first; review against them.
            This is a .NET 8 C# CLI (Spectre.Console, Docker.DotNet, SSH.NET,
            YamlDotNet) that manages a Mac Mini homelab, plus the
            docker-compose services and config/ it runs. The repo is public.
            Focus, in order:

            1. Secret leakage. API keys, tokens and passwords (Anthropic,
               GitHub, AdGuard, Uptime Kuma, Home Assistant, SSH keys) must
               never reach logs, AnsiConsole output, exception messages,
               test fixtures that look real, or committed files. Only
               config/homelab-cli.yaml.example belongs in git, with
               placeholders. Nothing under data/ may be committed.
            2. Correctness and safety of operations on the host: Docker
               calls that stop, remove or recreate containers, SSH commands
               built from user input (injection, quoting), Process.Start
               arguments, file paths (no hardcoded /Users/... paths), and
               anything that could take a running service down or delete
               data without confirmation.
            3. C# and .NET: async/await end to end with CancellationToken
               passed through, no .Result/.Wait() or async void, IDisposable
               resources disposed, nullable warnings respected, exceptions
               caught at the command layer with a clear [red] message and a
               non-zero exit code. Spectre markup must escape untrusted text
               (Markup.Escape) or it throws on [ and ].
            4. Architecture per CLAUDE.md: commands stay thin and call
               services through I<Name> interfaces registered in Program.cs;
               no direct Docker client calls or Console.WriteLine in
               commands; new commands added to completion scripts and
               CHANGELOG.md.
            5. Tests: xUnit + Moq + FluentAssertions, external dependencies
               (Docker, HTTP, SSH, file system) mocked, no real network.
               New behaviour needs tests, and tests must actually cover the
               edge cases they claim to.
            6. docker-compose.yml and config/ (Suricata, logrotate, shell):
               pinned or deliberately floating images, host networking and
               privileges only where needed, volumes not exposing secrets,
               log/retention bounds, shell scripts with set -euo pipefail
               and quoted variables.
            7. Over-engineering: abstractions, packages or options the task
               did not ask for.

            Be specific: file:line, a concrete failing scenario, a suggested
            fix. If you find nothing significant, say so plainly rather than
            padding. Do not approve or merge.

      # The action can exit green without reviewing (bootleg#17): require claude[bot]'s summary for this SHA.
      - name: Verify a review was actually posted
        if: steps.draft.outputs.draft != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Comments by $1 starting with $2; only constants and a SHA reach jq.
          count() {
            gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq "[.[] | select(.user.login == \"$1\" and (.body | startswith(\"$2\")))] | length" \
              | awk '{s+=$1} END {print s+0}'
          }

          # Own line: a failure inside [ "$(...)" ] is ignored even with pipefail.
          n="$(count 'claude[bot]' "## Claude review of $HEAD_SHA")"
          if [ "$n" -gt 0 ]; then
            # Reject a summary carrying an attribution footer line.
            footer="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq "[.[] | select(.user.login == \"claude[bot]\" and (.body | startswith(\"## Claude review of $HEAD_SHA\")) and (.body | test(\"(?m)^[^A-Za-z]*Generated with .?Claude Code.?([(][^ )]*[)])?[^A-Za-z0-9]*$|(?m)^Co-Authored-By:\"; \"i\")))] | length" \
              | awk '{s+=$1} END {print s+0}')"
            if [ "$footer" -gt 0 ]; then
              echo "::error::The review summary contains an attribution footer line. The prompt and settings forbid it; check the action's configuration. To recover, delete that bot comment and re-run this job, or push a new commit."
              exit 1
            fi
            echo "ok - review of $HEAD_SHA posted"; exit 0
          fi

          # Three-dot: stable across main moving; --no-renames shows code moved into .md.
          range="origin/$DEFAULT_BRANCH...$HEAD_SHA"
          wf=.github/workflows/claude-review.yml

          rc=0; git diff --quiet "$range" -- "$wf" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::git diff failed ($rc)"; exit 1; fi
          if [ "$rc" -eq 0 ]; then
            echo "::error::No '## Claude review of $HEAD_SHA' comment from claude[bot]. The action did not complete a review of this commit; check its log."
            exit 1
          fi

          # Workflow-only PRs (plus top-level .md) need a manual review of this exact SHA.
          files="$(git diff --name-only --no-renames "$range")"
          other="$(printf '%s\n' "$files" | grep -vE '^\.github/workflows/claude-review\.yml$|^[^/]+\.md$' || true)"
          if [ -n "$other" ]; then
            echo "::error::This PR changes $wf, which the action cannot review, AND other files it must review:"
            echo "$other"
            echo "Split the workflow change into its own PR."
            exit 1
          fi

          n="$(count 'moudlajs' "## Independent review (manual - $HEAD_SHA)")"
          if [ "$n" -eq 0 ]; then
            echo "::error::This PR changes $wf, which the action cannot review. Post an independent review whose first line is exactly '## Independent review (manual - $HEAD_SHA)' per CLAUDE.md, then re-run this job."
            exit 1
          fi
          echo "::warning::Review workflow change - accepted on a manual independent review of $HEAD_SHA, not the action."
