# Run hourly by logrotate.cron inside the suricata container.
/var/log/suricata/*.log /var/log/suricata/*.json {
    daily
    maxsize 100M
    rotate 7
    compress
    missingok
    notifempty
    sharedscripts
    su suricata suricata
    postrotate
        suricatasc -c reopen-log-files >/dev/null || true
    endscript
}
